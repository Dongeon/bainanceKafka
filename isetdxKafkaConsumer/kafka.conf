# =============================================================================
# isetdxKafkaConsumer 설정 파일
# =============================================================================

# ── Kafka 브로커 연결 ─────────────────────────────────────────────────────────
kafka.bootstrap.servers=localhost:9092

# ── 보안: 로컬 개발 환경은 SASL_SSL 비활성화 ──────────────────────────────────
# kafka.security.protocol=SASL_SSL
# kafka.sasl.mechanism=SCRAM-SHA-256
# kafka.sasl.jaas.config=...

# ── Heartbeat 모니터링 ─────────────────────────────────────────────────────────
consumer.heartbeat.topic=producer-heartbeat
consumer.status.topic=producer-status
consumer.heartbeat.timeout.ms=15000

# ── TopicMonitor ───────────────────────────────────────────────────────────────
monitor.topic.exclude.prefix=__
monitor.topic.interval.ms=60000

# ── DB 연결 ────────────────────────────────────────────────────────────────────
db.url=jdbc:mariadb://localhost:33061/isetdx_kafka?serverTimezone=Asia/Seoul
db.user=isetdx_kafka
db.password=isetdx1234
