plugins {
    id 'java'
    id 'application'
}

application {
    mainClass = 'org.example.Main'
}

run {
    standardInput = System.in
    jvmArgs '-Dfile.encoding=UTF-8'
}

group   = 'org.example'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    // ── IsetDx 라이브러리 ─────────────────────────────────────────────────
    implementation files('../IsetDx_kafka-producer-lib/build/libs/IsetDx_kafka-producer-lib-1.0.0.jar')
    implementation files('../IsetDx_kafka-leader-lib/build/libs/IsetDx_kafka-leader-lib-1.0.0.jar')

    // ── Binance WebSocket 클라이언트 ──────────────────────────────────────
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // ── JSON ─────────────────────────────────────────────────────────────
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.1'

    // ── Logging ──────────────────────────────────────────────────────────
    implementation 'org.slf4j:slf4j-api:2.0.13'
    implementation 'ch.qos.logback:logback-classic:1.5.6'
}

test {
    useJUnitPlatform()
}
