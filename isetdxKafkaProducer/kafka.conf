# =============================================================================
# isetdxKafkaProducer 설정 파일
# kafka.conf.template을 기반으로 작성된 실행 설정입니다.
# =============================================================================

# ── Kafka 브로커 연결 ─────────────────────────────────────────────────────────
kafka.bootstrap.servers=localhost:9092

# ── 보안: 로컬 개발 환경은 SASL_SSL 비활성화 ──────────────────────────────────
# 운영 환경에서는 아래 주석을 해제하고 인증서 경로를 설정하세요.
# kafka.security.protocol=SASL_SSL
# kafka.sasl.mechanism=SCRAM-SHA-256
# kafka.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required \
#   username="myuser" \
#   password="mypassword";
# kafka.ssl.truststore.location=/etc/kafka/ssl/truststore.jks
# kafka.ssl.truststore.password=changeit

# ── Kafka Producer 튜닝 ────────────────────────────────────────────────────
kafka.acks=1
kafka.linger.ms=10
kafka.batch.size=16384
kafka.compression.type=lz4
kafka.retries=3
kafka.retry.backoff.ms=1000

# ── 라이브러리 동작 설정 ────────────────────────────────────────────────────
kafka.partition.key.field=symbol
kafka.error.policy=log_and_skip
kafka.send.mode=async

# ── 리더 선출 (kafka-leader-lib) ───────────────────────────────────────────
# 두 인스턴스 실행 시 args[0]으로 각각 다른 id를 지정하세요.
# 미설정 시 랜덤 생성.
leader.instance.id=producer-1
# weight: 높을수록 split-brain 발생 시 ACTIVE 유지 우선순위 높음
leader.instance.weight=100
leader.heartbeat.topic=producer-heartbeat
leader.prep.base.ms=5000
leader.prep.jitter.ms=2000
leader.activation.timeout.ms=15000
leader.heartbeat.interval.sec=5

# ── Binance 전용 설정 ─────────────────────────────────────────────────────
# 수집할 심볼 수 (660 이하: USDT 마켓만, 초과 시: 전체 마켓)
binance.symbol.count=10
# Kline 인터벌 (콤마 구분)
binance.kline.intervals=1m,5m,15m,1h
# 전송 대상 토픽
binance.ticker.topic=crypto-ticker
binance.kline.topic=crypto-kline
