spring:
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: bainance-api-consumer-group
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  datasource:
    url: jdbc:mariadb://localhost:33061/bainance?serverTimezone=Asia/Seoul
    username: deadde
    password: qwer1234
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none       # 기존 테이블을 건드리지 않음
    show-sql: false
    open-in-view: false

isetdx:
  datasource:
    url: jdbc:mariadb://localhost:33061/isetdx_kafka?serverTimezone=Asia/Seoul
    username: isetdx_kafka
    password: isetdx1234
    driver-class-name: org.mariadb.jdbc.Driver

server:
  port: 8081

logging:
  level:
    org.example: INFO
    org.hibernate.SQL: WARN
